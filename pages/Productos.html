<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Frutty Cream - Productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow">
    <div class="container">
      <a class="navbar-brand fw-bold text-danger" href="index.html">Frutty Cream 🍦</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="Productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="Contactos.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="Nosotros.html">Nosotros</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Sección de productos -->
  <section class="container py-5">
    <h2 class="text-center mb-4">Nuestros Helados</h2>
    <div class="row g-4">
      <!-- Producto 1 -->
      <div class="col-md-4">
        <div class="card producto-card shadow-sm">
          <img src="../img/productos/fresa.jpg" class="card-img-top" alt="Helado de fresa">
          <div class="card-body text-center">
            <h5 class="card-title">Helado de Fresa</h5>
            <p class="card-text">Refrescante y natural con trozos de fruta.</p>
            <button class="btn btn-danger btn-animar">Comprar</button>
          </div>
        </div>
      </div>
      <!-- Producto 2 -->
      <div class="col-md-4">
        <div class="card producto-card shadow-sm">
          <img src="../img/productos/chocolate.jpg" class="card-img-top" alt="Helado de chocolate">
          <div class="card-body text-center">
            <h5 class="card-title">Helado de Chocolate</h5>
            <p class="card-text">Intenso sabor con cacao premium.</p>
            <button class="btn btn-danger btn-animar">Comprar</button>
          </div>
        </div>
      </div>
      <!-- Producto 3 -->
      <div class="col-md-4">
        <div class="card producto-card shadow-sm">
          <img src="../img/productos/vainilla.jpg" class="card-img-top" alt="Helado de vainilla">
          <div class="card-body text-center">
            <h5 class="card-title">Helado de Vainilla</h5>
            <p class="card-text">Clásico y cremoso con esencia natural.</p>
            <button class="btn btn-danger btn-animar">Comprar</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
